<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Gouffre de Ouagne</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- plugin to deal with KML files -->
  <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.4/leaflet-omnivore.min.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css" />
  <script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }

    .leaflet-popup-content {
      text-align: center;
      font-size: xx-large;
    }
    
    .leaflet-popup-content img {
      max-width: 400px;
      display: block;
      margin-bottom: 6px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // --- Map init ---
  const map = L.map('map', {
    minZoom: 2,
    maxZoom: 21,
    zoomSnap: 0.5,
    zoomDelta: 0.5
  }).setView([47.4032 , 3.5018 ], 17);

  L.control.locate().addTo(map);

  L.tileLayer.wms('https://data.geopf.fr/wms-r', {
    service: 'WMS',
    version: '1.3.0',
    request: 'GetMap',
    layers: 'IGNF_LIDAR-HD_MNT_ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW',
    styles: '',
    format: 'image/png',
    transparent: false,
    crs: L.CRS.EPSG3857,
    tileSize: 512,
    minZoom: 2,
    maxZoom: 21,
    zoomSnap: 0.5,
    zoomDelta: 0.5
  }).addTo(map);

  L.control.scale().addTo(map);

  // --- Optional reference layer (OSM, very light) ---
  const osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { opacity: 0.15 }
  ).addTo(map);

  // --- Load KML points ---

  omnivore.kml(
    'https://raw.githubusercontent.com/CDS45/gouffre-ouagne/refs/heads/main/path.kml'
  )
  .on('ready', function () {
    console.log('KML loaded');
    this.setStyle({
        color: '#5C4033',
        weight: 1,
        fillColor: '#5C4033',
        fillOpacity: 1
    });
    map.fitBounds(this.getBounds());
  })
  .on('error', function (error) {
    console.error('KML loading error:', error);
  });

  // --- Load your GeoJSON points ---
  
  /*
  fetch('https://raw.githubusercontent.com/CDS45/gouffre-ouagne/refs/heads/main/path.json')
    .then(r => r.json())
    .then(data => {
      L.geoJSON(data, {
        style: {
          color: '#5C4033',
          weight: 1,
          fillColor: '#5C4033',
          fillOpacity: 1
        }
      }).addTo(map);
    });
    */

  
  fetch('https://raw.githubusercontent.com/CDS45/gouffre-ouagne/refs/heads/main/details.geojson')
    .then(r => r.json())
    .then(data => {
      L.geoJSON(data, {
        pointToLayer: (feature, latlng) =>
          L.circleMarker(latlng, {
            radius: 24,
            color: '#ff0000',      // stroke color 
            weight: 1,             // stroke width
            opacity: 0.8,          // stroke opacity
            fillColor: '#ff0000',  // fill color
            fillOpacity: 0.1       // ← transparency of the point
          }),

        onEachFeature: (feature, layer) => {
          const p = feature.properties;

          let html = `<strong>${p.name}</strong><br/>`;

          if (p.scan3d) {
            html += `<a href="${p.scan3d}" target="_blank">`;
          }
          
          if (p.image) {
            html += `<img src="${p.image}" alt="3D scan">`;
          }

          if (p.scan3d) {
            html += `</a>`;
          }

          layer.bindPopup(html, {
            maxWidth: 600
          });
        }
      }).addTo(map);
    });

</script>
</body>
</html>
